name: Release to npm

on:
  release:
    types: [published]

# The verification job is intentionally unprivileged. The publish job overrides
# this only to add the short-lived OIDC permission required by npm.
permissions:
  contents: read

concurrency:
  group: npm-release-pi-microsandbox-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  # Node 24.19.0 bundles npm 11.17.0, so both release tools are supplied by
  # one immutable Node distribution instead of an ad-hoc global npm install.
  NODE_VERSION: "24.19.0"
  NPM_VERSION: "11.17.0"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  verify:
    name: Verify and build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bind reruns to the immutable commit captured by the release event,
          # even if the tag is later moved or recreated.
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify the bundled npm CLI
        shell: bash
        run: |
          set -euo pipefail
          actual_npm_version="$(npm --version)"
          if [[ "$actual_npm_version" != "$NPM_VERSION" ]]; then
            echo "Expected npm ${NPM_VERSION}, got ${actual_npm_version}" >&2
            exit 1
          fi

      - name: Verify repository, tag, and package identity
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          FULL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "hcohe/pi-microsandbox" ]]; then
            echo "Refusing release from unexpected repository: $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" != "tag" || "$FULL_REF" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "Refusing to release from non-tag ref: $FULL_REF" >&2
            exit 1
          fi
          if [[ "$REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Release tag ${RELEASE_TAG} does not equal github.ref_name ${REF_NAME}" >&2
            exit 1
          fi
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "Checked-out commit ${actual_commit} does not equal release event commit ${EXPECTED_COMMIT}" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "Checkout is not clean before verification" >&2
            git status --short >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expectedName = "pi-microsandbox";
          const stableVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (pkg.name !== expectedName) {
            throw new Error(`Expected package ${expectedName}, got ${pkg.name}`);
          }
          if (typeof pkg.version !== "string" || !stableVersion.test(pkg.version)) {
            throw new Error(`Invalid package version: ${pkg.version}`);
          }
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} must equal v${pkg.version}`);
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `name=${pkg.name}\nversion=${pkg.version}\n`,
          );
          NODE

      - name: Resolve the configured default image release
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_reference="$(node --experimental-strip-types --input-type=module <<'NODE'
          import { DEFAULT_CONFIG } from "./extensions/pi-msb/config.ts";

          const pattern = /^ghcr\.io\/hcohe\/pi-microsandbox:((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))@(sha256:[0-9a-f]{64})$/;
          const match = typeof DEFAULT_CONFIG.image === "string" && pattern.exec(DEFAULT_CONFIG.image);
          if (!match) {
            throw new Error("DEFAULT_CONFIG.image must be a digest-pinned stable pi-microsandbox release reference");
          }
          process.stdout.write(DEFAULT_CONFIG.image);
          NODE
          )"
          image_tag_reference="${image_reference%@*}"
          image_digest="${image_reference##*@}"
          image_version="${image_tag_reference#ghcr.io/hcohe/pi-microsandbox:}"
          image_tag="image-v${image_version}"
          node scripts/image-variants.mjs refs release \
            ghcr.io/hcohe/pi-microsandbox "$image_version" >/dev/null

          # Fetch only the configured image tag and peel annotated tags to the
          # commit that the image workflow checked out and attested.
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${image_tag}"
          image_revision="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          if [[ ! "$image_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Image tag ${image_tag} did not resolve to a full commit SHA." >&2
            exit 1
          fi

          {
            echo "reference=$image_reference"
            echo "tag_reference=$image_tag_reference"
            echo "digest=$image_digest"
            echo "version=$image_version"
            echo "tag=$image_tag"
            echo "revision=$image_revision"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve and verify the public configured image cohort
        shell: bash
        env:
          EXPECTED_DEFAULT_REFERENCE: ${{ steps.image.outputs.tag_reference }}
          EXPECTED_DEFAULT_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          refs="$RUNNER_TEMP/release-image-refs.tsv"
          resolved="$RUNNER_TEMP/release-image-resolved.tsv"
          : > "$resolved"
          node scripts/image-variants.mjs refs release \
            ghcr.io/hcohe/pi-microsandbox "$IMAGE_VERSION" > "$refs"
          [[ -s "$refs" ]]

          saw_default=false
          while IFS=$'\t' read -r variant image_reference; do
            if [[ "$variant" == "default" ]]; then
              saw_default=true
              if [[ "$image_reference" != "$EXPECTED_DEFAULT_REFERENCE" ]]; then
                echo "Generated default cohort reference ${image_reference} does not match configured ${EXPECTED_DEFAULT_REFERENCE}." >&2
                exit 1
              fi
            fi

            digest_file="$RUNNER_TEMP/release-${variant}-digest.json"
            if ! docker buildx imagetools inspect "$image_reference" \
              --format '{{json .Manifest.Digest}}' > "$digest_file"; then
              echo "The configured sandbox image ${image_reference} must be published and public before the npm release." >&2
              exit 1
            fi
            digest="$(node scripts/image-variants.mjs read-digest "$digest_file")"
            if [[ "$variant" == "default" && "$digest" != "$EXPECTED_DEFAULT_DIGEST" ]]; then
              echo "Configured default digest ${EXPECTED_DEFAULT_DIGEST} does not match ${image_reference} digest ${digest}." >&2
              exit 1
            fi
            immutable_reference="ghcr.io/hcohe/pi-microsandbox@${digest}"

            manifest="$RUNNER_TEMP/release-${variant}-manifest.json"
            docker buildx imagetools inspect --raw "$immutable_reference" > "$manifest"
            node scripts/image-variants.mjs verify-manifest "$manifest" "$immutable_reference"

            for platform in linux/amd64 linux/arm64; do
              config="$RUNNER_TEMP/release-${variant}-${platform//\//-}.json"
              docker buildx imagetools inspect "$immutable_reference" \
                --format "{{json (index .Image \"$platform\")}}" > "$config"
              actual_revision="$(node scripts/image-variants.mjs config-revision \
                "$config" "$variant" "$IMAGE_VERSION" "$platform")"
              if [[ "$actual_revision" != "$IMAGE_REVISION" ]]; then
                echo "${immutable_reference} ${platform} revision ${actual_revision} does not match image tag commit ${IMAGE_REVISION}." >&2
                exit 1
              fi
            done

            printf '%s\t%s\t%s\n' "$variant" "$image_reference" "$digest" >> "$resolved"
          done < "$refs"

          if [[ "$saw_default" != true || ! -s "$resolved" ]]; then
            echo "The generated image cohort did not contain the configured default variant." >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry for provenance lookup
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify provenance for the immutable image cohort
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/release-image-resolved.tsv"
          [[ -s "$resolved" ]]

          while IFS=$'\t' read -r variant image_reference digest; do
            immutable_reference="ghcr.io/hcohe/pi-microsandbox@${digest}"
            gh attestation verify "oci://${immutable_reference}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/default-image.yml" \
              --signer-digest "$IMAGE_REVISION" \
              --source-ref "refs/tags/${IMAGE_TAG}" \
              --source-digest "$IMAGE_REVISION" \
              --deny-self-hosted-runners
          done < "$resolved"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

      - name: Recheck public image tags are unchanged
        shell: bash
        env:
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/release-image-resolved.tsv"
          [[ -s "$resolved" ]]

          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${IMAGE_TAG}"
          current_revision="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          if [[ "$current_revision" != "$IMAGE_REVISION" ]]; then
            echo "Image source tag ${IMAGE_TAG} moved from ${IMAGE_REVISION} to ${current_revision} during verification." >&2
            exit 1
          fi

          while IFS=$'\t' read -r variant image_reference expected_digest; do
            digest_file="$RUNNER_TEMP/release-${variant}-recheck-digest.json"
            if ! docker buildx imagetools inspect "$image_reference" \
              --format '{{json .Manifest.Digest}}' > "$digest_file"; then
              echo "Anonymous image lookup failed for ${image_reference}." >&2
              exit 1
            fi
            actual_digest="$(node scripts/image-variants.mjs read-digest "$digest_file")"
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "Image tag ${image_reference} moved from ${expected_digest} to ${actual_digest} during verification." >&2
              exit 1
            fi
          done < "$resolved"

      # Install scripts must remain enabled because fs-ext is a native dependency.
      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release-check

      - name: Reject generated or dirty files
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "Release checks changed the clean checkout" >&2
            git status --short >&2
            exit 1
          fi

      - name: Pack the release artifact once
        id: pack
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifact"
          pack_json="$RUNNER_TEMP/npm-pack.json"
          mkdir -p "$artifact_dir"

          npm pack --json --pack-destination "$artifact_dir" > "$pack_json"

          source_commit="$(git rev-parse HEAD)"
          ARTIFACT_DIR="$artifact_dir" PACK_JSON="$pack_json" SOURCE_COMMIT="$source_commit" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const result = JSON.parse(fs.readFileSync(process.env.PACK_JSON, "utf8"));
          if (!Array.isArray(result) || result.length !== 1) {
            throw new Error("npm pack must produce exactly one artifact");
          }
          const packed = result[0];
          if (packed.name !== process.env.PACKAGE_NAME || packed.version !== process.env.PACKAGE_VERSION) {
            throw new Error("npm pack identity does not match package.json");
          }
          if (path.basename(packed.filename) !== packed.filename || !packed.filename.endsWith(".tgz")) {
            throw new Error(`Unsafe tarball filename: ${packed.filename}`);
          }

          const tarballPath = path.join(process.env.ARTIFACT_DIR, packed.filename);
          const bytes = fs.readFileSync(tarballPath);
          const sha256 = crypto.createHash("sha256").update(bytes).digest("hex");
          const integrity = `sha512-${crypto.createHash("sha512").update(bytes).digest("base64")}`;
          if (packed.integrity !== integrity) {
            throw new Error("npm pack integrity does not match the tarball bytes");
          }

          const metadata = {
            schema: 1,
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.SOURCE_COMMIT,
            ref: process.env.GITHUB_REF,
            releaseTag: process.env.RELEASE_TAG,
            packageName: packed.name,
            packageVersion: packed.version,
            tarball: packed.filename,
            sha256,
            integrity,
            registry: process.env.NPM_CONFIG_REGISTRY,
          };
          fs.writeFileSync(
            path.join(process.env.ARTIFACT_DIR, `${packed.filename}.sha256`),
            `${sha256}  ${packed.filename}\n`,
          );
          fs.writeFileSync(
            path.join(process.env.ARTIFACT_DIR, "release-metadata.json"),
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `tarball=${packed.filename}\nsha256=${sha256}\nintegrity=${integrity}\n`,
          );
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            "### npm release artifact\n" +
              `- Package: \`${packed.name}@${packed.version}\`\n` +
              `- Tarball: \`${packed.filename}\`\n` +
              `- SHA-256: \`${sha256}\`\n` +
              `- Integrity: \`${integrity}\`\n`,
          );
          NODE

      - name: Smoke-test the exact release artifact
        shell: bash
        env:
          TARBALL: ${{ runner.temp }}/release-artifact/${{ steps.pack.outputs.tarball }}
        run: npm run package-smoke -- "$TARBALL"

      - name: Confirm exact-artifact testing left source clean
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "Exact-artifact smoke testing changed the clean checkout" >&2
            git status --short >&2
            exit 1
          fi

      - name: Check for an existing registry version
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          EXPECTED_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          set -euo pipefail
          registry_query="$RUNNER_TEMP/registry-version.mjs"
          cat > "$registry_query" <<'NODE'
          const [name, version] = process.argv.slice(2);
          const url = new URL(
            `${encodeURIComponent(name)}/${encodeURIComponent(version)}`,
            "https://registry.npmjs.org/",
          );
          let response;
          try {
            response = await fetch(url, {
              headers: { accept: "application/json" },
              signal: AbortSignal.timeout(15_000),
            });
          } catch (error) {
            console.error(`Registry request failed: ${error.message}`);
            process.exit(2);
          }
          if (response.status === 404) process.exit(44);
          if (!response.ok) {
            console.error(`Registry returned HTTP ${response.status}`);
            process.exit(2);
          }
          const manifest = await response.json();
          if (typeof manifest?.dist?.integrity !== "string") {
            console.error("Registry manifest has no dist.integrity");
            process.exit(2);
          }
          process.stdout.write(manifest.dist.integrity);
          NODE

          if existing_integrity="$(node "$registry_query" "$PACKAGE_NAME" "$PACKAGE_VERSION")"; then
            if [[ "$existing_integrity" != "$EXPECTED_INTEGRITY" ]]; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists with different integrity" >&2
              echo "Expected: $EXPECTED_INTEGRITY" >&2
              echo "Registry: $existing_integrity" >&2
              exit 1
            fi
            echo "Registry already contains the exact artifact; publish job will be an idempotent no-op."
          else
            status=$?
            if [[ $status -eq 44 ]]; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."
            else
              echo "Could not determine registry state safely." >&2
              exit "$status"
            fi
          fi

      - name: Upload the exact release artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-artifact/${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/release-artifact/${{ steps.pack.outputs.tarball }}.sha256
            ${{ runner.temp }}/release-artifact/release-metadata.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record workflow artifact digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "- GitHub artifact SHA-256: ${ARTIFACT_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish exact artifact
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-artifact
          digest-mismatch: error

      - name: Set up Node.js and the public npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify the bundled npm CLI
        shell: bash
        run: |
          set -euo pipefail
          actual_npm_version="$(npm --version)"
          if [[ "$actual_npm_version" != "$NPM_VERSION" ]]; then
            echo "Expected npm ${NPM_VERSION}, got ${actual_npm_version}" >&2
            exit 1
          fi

      - name: Verify downloaded tarball and metadata
        id: artifact
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const dir = process.env.ARTIFACT_DIR;
          const metadata = JSON.parse(fs.readFileSync(path.join(dir, "release-metadata.json"), "utf8"));
          const fail = message => { throw new Error(message); };
          if (metadata.schema !== 1) fail("Unsupported metadata schema");
          if (metadata.repository !== "hcohe/pi-microsandbox") fail("Unexpected source repository");
          if (metadata.releaseTag !== process.env.RELEASE_TAG) fail("Release tag changed between jobs");
          if (metadata.ref !== `refs/tags/${process.env.RELEASE_TAG}`) fail("Artifact was not built from the release tag");
          if (metadata.packageName !== "pi-microsandbox") fail("Unexpected package name");
          if (`v${metadata.packageVersion}` !== process.env.RELEASE_TAG) fail("Package version does not match release tag");
          if (!/^[a-z0-9][a-z0-9._-]*\.tgz$/.test(metadata.tarball)) fail("Unsafe tarball filename");
          if (metadata.commit !== process.env.EXPECTED_COMMIT) fail("Artifact commit does not match release event commit");
          if (metadata.registry !== "https://registry.npmjs.org/") fail("Unexpected npm registry");

          const expectedFiles = [
            metadata.tarball,
            `${metadata.tarball}.sha256`,
            "release-metadata.json",
          ].sort();
          const actualFiles = fs.readdirSync(dir, { withFileTypes: true })
            .filter(entry => entry.isFile())
            .map(entry => entry.name)
            .sort();
          if (JSON.stringify(actualFiles) !== JSON.stringify(expectedFiles)) {
            fail(`Unexpected artifact files: ${actualFiles.join(", ")}`);
          }

          const bytes = fs.readFileSync(path.join(dir, metadata.tarball));
          const sha256 = crypto.createHash("sha256").update(bytes).digest("hex");
          const integrity = `sha512-${crypto.createHash("sha512").update(bytes).digest("base64")}`;
          if (sha256 !== metadata.sha256) fail("Tarball SHA-256 mismatch");
          if (integrity !== metadata.integrity) fail("Tarball npm integrity mismatch");
          const checksum = fs.readFileSync(path.join(dir, `${metadata.tarball}.sha256`), "utf8");
          if (checksum !== `${sha256}  ${metadata.tarball}\n`) fail("Checksum file mismatch");

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `name=${metadata.packageName}\nversion=${metadata.packageVersion}\n` +
              `tarball=${metadata.tarball}\nsha256=${sha256}\nintegrity=${integrity}\n`,
          );
          NODE

          echo "Verified GitHub artifact digest: $EXPECTED_ARTIFACT_DIGEST"

      - name: Publish with OIDC or accept an exact duplicate
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.artifact.outputs.name }}
          PACKAGE_VERSION: ${{ steps.artifact.outputs.version }}
          TARBALL: ${{ runner.temp }}/release-artifact/${{ steps.artifact.outputs.tarball }}
          EXPECTED_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
        run: |
          set -euo pipefail
          registry_query="$RUNNER_TEMP/registry-version.mjs"
          cat > "$registry_query" <<'NODE'
          const [name, version] = process.argv.slice(2);
          const url = new URL(
            `${encodeURIComponent(name)}/${encodeURIComponent(version)}`,
            "https://registry.npmjs.org/",
          );
          let response;
          try {
            response = await fetch(url, {
              headers: { accept: "application/json" },
              signal: AbortSignal.timeout(15_000),
            });
          } catch (error) {
            console.error(`Registry request failed: ${error.message}`);
            process.exit(2);
          }
          if (response.status === 404) process.exit(44);
          if (!response.ok) {
            console.error(`Registry returned HTTP ${response.status}`);
            process.exit(2);
          }
          const manifest = await response.json();
          if (typeof manifest?.dist?.integrity !== "string") {
            console.error("Registry manifest has no dist.integrity");
            process.exit(2);
          }
          process.stdout.write(manifest.dist.integrity);
          NODE

          registry_state() {
            local found status
            if found="$(node "$registry_query" "$PACKAGE_NAME" "$PACKAGE_VERSION")"; then
              if [[ "$found" == "$EXPECTED_INTEGRITY" ]]; then
                return 0
              fi
              echo "Registry integrity differs from the verified artifact" >&2
              echo "Expected: $EXPECTED_INTEGRITY" >&2
              echo "Registry: $found" >&2
              return 42
            else
              status=$?
              return "$status"
            fi
          }

          should_publish=true
          if registry_state; then
            should_publish=false
            echo "Exact package version already exists; nothing to publish."
          else
            status=$?
            case "$status" in
              44) echo "Registry version is absent; proceeding with OIDC publication." ;;
              42) exit 1 ;;
              *) echo "Could not determine registry state safely." >&2; exit "$status" ;;
            esac
          fi

          if [[ "$should_publish" == true ]]; then
            # npm trusted publishing exchanges GitHub's short-lived OIDC identity.
            # No long-lived npm credential or token fallback is configured.
            if npm publish "$TARBALL" --access public; then
              echo "npm publish completed."
            else
              publish_status=$?
              echo "npm publish exited ${publish_status}; checking for a successful concurrent publish." >&2
              matched=false
              for attempt in 1 2 3 4 5 6; do
                if registry_state; then
                  matched=true
                  echo "Registry now contains the exact artifact; treating the retry as successful."
                  break
                else
                  status=$?
                  if [[ $status -eq 42 ]]; then exit 1; fi
                fi
                sleep $((attempt * 2))
              done
              if [[ "$matched" != true ]]; then
                echo "Publish failed and the exact artifact did not appear in the registry." >&2
                exit "$publish_status"
              fi
            fi
          fi

          # Registry metadata can lag a successful publish. Verify it with bounded retries.
          verified=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if registry_state; then
              verified=true
              break
            else
              status=$?
              if [[ $status -eq 42 ]]; then exit 1; fi
            fi
            if [[ $attempt -lt 8 ]]; then sleep $((attempt * 2)); fi
          done
          if [[ "$verified" != true ]]; then
            echo "Public registry did not expose matching integrity after bounded retries." >&2
            exit 1
          fi

          echo "Verified ${PACKAGE_NAME}@${PACKAGE_VERSION} with integrity ${EXPECTED_INTEGRITY}"
          {
            echo "### npm publication"
            echo "- Package: \`${PACKAGE_NAME}@${PACKAGE_VERSION}\`"
            echo "- Integrity: \`${EXPECTED_INTEGRITY}\`"
            echo "- Result: published or already present with identical bytes"
          } >> "$GITHUB_STEP_SUMMARY"
